services:
  redis:
    image: redis:7-alpine
    container_name: image-worker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  worker:
    build: .
    container_name: image-worker-worker
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
    volumes:
      - ./input:/app/input
      - ./output:/app/output

volumes:
  redis-data: